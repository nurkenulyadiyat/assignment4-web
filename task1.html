<body>
    <nav class="bg-light border-bottom p-3" aria-label="Main navigation">
        <div class="container d-flex flex-wrap align-items-center gap-3">
        <strong>Assignment 4</strong>

    <main class="container py-4">
        <h1 class="h3">Task 1 - HTML5 Validation</h1>
        <p class="text-secondary">Try empty fields, a wrong email address, or a short message.</p>

        <form class="plain-form" action="success.html">
            <div class="field">
                <label for="name">Name *</label>
                <input type="text" id="name" required minlength="2" maxlength="40">
                <small>2 to 40 characters.</small>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <small>Example: student@example.com</small>
            </div>
            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" rows="4" required minlength="10" maxlength="300"></textarea>
                <small>10 to 300 characters.</small>
            </div>
            <button class="submit">Submit</button>
        </form>
    </main>
</body>
</html>
