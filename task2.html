<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form - Assignment 4</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="bg-light border-bottom p-3" aria-label="Main navigation">
        <div class="container d-flex flex-wrap align-items-center gap-3">
            <strong>Assignment 4</strong>
            <a href="index.html" class="text-decoration-none">Home</a>
            <a href="task0.html" class="text-decoration-none">Task 0</a>
            <a href="task1.html" class="text-decoration-none">Task 1</a>

        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h3">Task 2 - Bootstrap Form</h1>
        <p class="text-secondary">Bootstrap form-control, form-label, placeholders, helper text and grid.</p>

        <form class="row g-3" action="success.html" method="get">
            <div class="col-md-6">
                <label for="name" class="form-label">Name *</label>
                <input id="name" type="text" class="form-control" placeholder="Your name" required>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email *</label>
                <input id="email" type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="col-12">
                <label for="message" class="form-label">Message *</label>
                <textarea id="message" class="form-control" rows="4" placeholder="Your message" required></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
